AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Zoom RAG Insight Engine - Serverless Application Model Template'

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        TRANSCRIPT_BUCKET: !Sub 'zoom-transcripts-${AWS::AccountId}'
        BEDROCK_KB_ID: !Ref BedrockKBId
        OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
        ZOOM_SECRETS_ARN: !Ref ZoomSecretsArn

Parameters:
  BedrockKBId:
    Type: String
    Description: Bedrock Knowledge Base ID

  OpenSearchEndpoint:
    Type: String
    Description: OpenSearch Serverless Collection Endpoint

  ZoomSecretsArn:
    Type: String
    Description: ARN of Zoom API credentials in Secrets Manager

  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool used to authorize query requests

Resources:

  # ------------------------------------------------------------
  # S3 BUCKETS
  # ------------------------------------------------------------

  TranscriptBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'zoom-transcripts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'zoom-rag-frontend-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ------------------------------------------------------------
  # IAM
  # ------------------------------------------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'zoom-rag-lambda-role-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'

      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

      Policies:

        - PolicyName: TranscriptS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                Resource:
                  - !Sub 'arn:aws:s3:::zoom-transcripts-${AWS::AccountId}/*'

        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'bedrock:Retrieve'
                  - 'bedrock:RetrieveAndGenerate'
                  - 'bedrock:InvokeModel'
                Resource: '*'

        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: !Ref ZoomSecretsArn

  # ------------------------------------------------------------
  # LAMBDA FUNCTIONS
  # ------------------------------------------------------------

  DataIngestionLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: zoom-data-ingestion
      CodeUri: src/lambdas/data_ingestion/
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

      Events:
        ZoomWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref ZoomRAGApi
            Path: /ingest
            Method: POST
            Auth:
              Authorizer: NONE

  DataProcessingLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: zoom-data-processing
      CodeUri: src/lambdas/data_processing/
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

      Events:
        S3EventRule:
          Type: S3
          Properties:
            Bucket: !Ref TranscriptBucket
            Events:
              - 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: transcripts/raw/
                  - Name: suffix
                    Value: .vtt

  QueryLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: zoom-query-handler
      CodeUri: src/lambdas/query_handler/
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn

      Environment:
        Variables:
          BEDROCK_MODEL_ARN: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'

      Events:
        QueryEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ZoomRAGApi
            Path: /query
            Method: POST

  # ------------------------------------------------------------
  # API GATEWAY
  # ------------------------------------------------------------

  ZoomRAGApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: zoom-rag-api
      StageName: prod

      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !Ref CognitoUserPoolArn

      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ------------------------------------------------------------
  # CLOUDFRONT
  # ------------------------------------------------------------

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true

        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ------------------------------------------------------------
  # NOTE
  # ------------------------------------------------------------
  #
  # OpenSearch Serverless, Bedrock Knowledge Base,
  # Cognito User Pool and Zoom Secrets are currently
  # expected to exist outside this stack and are passed
  # through Parameters.
  #

Outputs:

  ApiEndpoint:
    Description: API Gateway endpoint for backend Lambda
    Value: !Sub 'https://${ZoomRAGApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  TranscriptBucketName:
    Description: S3 bucket for storing Zoom transcripts
    Value: !Ref TranscriptBucket
    Export:
      Name: !Sub '${AWS::StackName}-TranscriptBucket'

  FrontendBucketName:
    Description: S3 bucket containing frontend files
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  FrontendBucketUrl:
    Description: Frontend S3 website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub '${AWS::StackName}-FrontendUrl'

  CloudFrontUrl:
    Description: CloudFront distribution hostname
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontUrl'

  DataIngestionFunctionArn:
    Description: Data ingestion Lambda ARN
    Value: !GetAtt DataIngestionLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DataIngestionArn'

  DataProcessingFunctionArn:
    Description: Data processing Lambda ARN
    Value: !GetAtt DataProcessingLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DataProcessingArn'

  QueryFunctionArn:
    Description: Query Lambda ARN
    Value: !GetAtt QueryLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-QueryArn'
